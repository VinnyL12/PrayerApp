services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    # SQL Server only ships x86_64 images; on Apple Silicon this runs under Rosetta.
    platform: linux/amd64
    container_name: prayerapp-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in .env (copy .env.example)}"
    ports:
      - "1433:1433"
    volumes:
      # Named volume so data survives `docker compose down` (but not `down -v`).
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sqlserver-data:
